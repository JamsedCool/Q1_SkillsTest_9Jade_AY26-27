<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device width, initial-scale=1.0"
        <title>Q1 Skills Test</title>
        <link rel="stylesheet" href="styles_Q1SkillsTest.css">
    </head>
    <body>
        <div class="container">
        <div class="left-panel">
        <h1>OBMC Robotics Club Application form</h1>
        <p>Welcome! please fill out this form to <Strog>apply</Strog> for our schools Robotics Club. If you like coding, designing, building, there's a place for you.</p>
        <img src="https://images-ext-1.discordapp.net/external/0wpdQQnQdtbfGIy7OkCA86clOPnPQCImkVHOsROnztE/%3Fq%3Dtbn%3AANd9GcRkRr73Y5KuG6frOqenhpKS82-_PgFBNQsYO5jZiH_CGQ%26s%3D10/https/encrypted-tbn0.gstatic.com/images?format=webp" alt="Robotics Club Robot">
        <form action="#" method="post">
            <fieldset>
                <legend>Application Form</legend>
                <label for="fullname">Full Name</label><br>
                <input type="text" id="email" name="email" placeholder="Enter your full name" required><br><br>
                <label for="email">Email;</label><br>
                <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
                <label>Year Level:</label><br>
                <input type="radio" id="grade 7" name="yearlevel" value="grade 7">
                <label for="grade7">Grade 7</label>
                <input type="radio" id="grade 8" name="yearlevel" value="grade 8">
                <label for="grade8">Grade 8</label>
                <input type="radio" id="grade 9" name="yearlevel" value="grade 9">
                <label for="grade9">Grade 9</label><br><br>
                <label>Experience level:</label><br>
                <input type="radio" id=beginner" name="experience" value="Beginner">
                <label for="beginner">Beginner</label>
                <input type="radio" id="intermediate" name="experience" value="Intermediate">
                <label for="intermediate">Intermediate</label>
                <input type="radio" id="advanced" name="experience" value="Advanced">
                <label for="advanced">Advanced</label>
                <label>Areas of Interest</label>
                <input type="checkbox" id="coding" name="interest" value="Coding">
                <label for="coding">Coding</label>
                <input type="checkbox" id="design" name="interest" value="Design">
                <label for="design">Design</label>
                <input type="checkbox" id="electronics" name="interest" value="Electronics>
                <label for="Electronics">Electronics</label><br><br>
                <label for="grade">Grade Level:</label><br>
                <select id="grade" name="grade">
                    <option value="grade7">Grade 7</option>
                    <option value="grade8">Grade 8</option>
                    <option value="grade9">Grade 9</option>
                    <option value="grade10">Grade 10</option>
                </select><br><br>
                <label for=""
            </fieldset>
        </form>

    </body>
</html>
